name: Reportar problema
description: Informe um defeito reproduzível no Projetarium, no instalador ou na atualização.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Obrigado por ajudar a melhorar o Projetarium. Issues são públicas: use somente dados fictícios e remova informações pessoais, caminhos locais, URLs privadas, tokens, bancos, dumps, anexos e segredos.
  - type: checkboxes
    id: privacy
    attributes:
      label: Proteção dos dados
      options:
        - label: Confirmei que o relato e os arquivos não contêm dados pessoais, credenciais, caminhos privados, conteúdo de projetos, bancos ou dumps.
          required: true
        - label: Preservei um backup independente antes de repetir operações que possam alterar ou remover dados.
          required: true
  - type: input
    id: version
    attributes:
      label: Versão do Projetarium
      description: Use a versão exibida em Configurações e nas notas da release.
      placeholder: "Exemplo: 0.1.0-beta.1"
    validations:
      required: true
  - type: dropdown
    id: edition
    attributes:
      label: Edição
      options:
        - Local
        - Self-hosted
        - Não consegui identificar
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Plataforma
      options:
        - Windows desktop
        - Web
        - Servidor Ubuntu
        - Servidor Debian
        - Outra plataforma
    validations:
      required: true
  - type: input
    id: platform_version
    attributes:
      label: Versão do sistema ou navegador
      placeholder: "Exemplo: Windows 11 24H2 ou Firefox 142"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Passos para reproduzir
      description: Use um projeto de teste e enumere o menor fluxo que ainda apresenta o problema.
      placeholder: |
        1. Abrir...
        2. Selecionar...
        3. O problema acontece quando...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Resultado esperado
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Resultado observado
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidências saneadas
      description: Capturas e pequenos trechos de log são opcionais. Oculte dados sensíveis de forma irreversível antes de anexar.
  - type: dropdown
    id: regression
    attributes:
      label: O problema funcionava em uma versão anterior?
      options:
        - Não sei
        - Não
        - Sim
    validations:
      required: true
